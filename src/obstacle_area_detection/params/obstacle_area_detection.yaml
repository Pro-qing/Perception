# ============================================================
# 库区障碍物检测节点配置文件
# ============================================================
# 该文件包含以下配置：
#   1. 基础参数(坐标系、topic、距离阈值等)
#   2. 点云滤波参数(降采样、Z轴、ROI)
#   3. 地面分割参数
#   4. 中距雷达外参标定参数
#   5. 库位检测区域边界框(在目标点局部坐标系下)
#   6. 车体轮廓多边形(用于过滤车辆自身的激光反射点)
#   7. 防误判参数(最小点数、滑动窗口、施密特触发器)
#   8. 外围聚类检测参数(Layer 2)
#   9. 调试参数
# ============================================================

# ---------- 基础参数配置 ----------
target_frame: "velodyne"                # 目标坐标系，所有点云都会变换到此坐标系
points_mid_topic: "/points_mid_calibration"  # mid360点云topic
distance_threshold: 0.4                 # 距离目标点小于此值时停止检测(米)
area_enable_distance: 10.0              # 库位检测启用距离(米)，车辆距库位小于此值时启用

# ---------- 点云滤波参数 ----------
voxel_leaf_size: 0.0                    # 体素降采样大小(米)，0表示不降采样
z_axis_min: -1.60                       # Z轴滤波最小值(米)
z_axis_max: 0.50                        # Z轴滤波最大值(米)
roi_radius: 10.0                        # ROI区域半径(米)
use_roi_filter: true                    # 是否启用ROI滤波

# ---------- 地面分割参数 ----------
ground_threshold: 0.15                  # RANSAC地面分割距离阈值(米)

# ---------- 中距雷达标定参数 ----------
# 用于补偿中距雷达的安装偏差(外参标定)
# 通过6DOF变换(平移+旋转)将原始点云变换到正确的位置
# 标定后的点云会发布到 /area_calibration_points 供调试
points_mid:
  x: 0.0          # X轴平移偏移(米)
  y: 0.0          # Y轴平移偏移(米)
  z: 0.0          # Z轴平移偏移(米)
  roll: 0.0       # 绕X轴旋转偏移(弧度)
  pitch: 0.0      # 绕Y轴旋转偏移(弧度)
  yaw: 0.0        # 绕Z轴旋转偏移(弧度)

# ---------- 库位检测区域参数 ----------
# 在目标点的局部坐标系下定义的3D边界框
# 所有库位共享同一套区域参数
# 检测逻辑：将障碍物点变换到目标点局部坐标系，判断是否在此范围内
#   X轴方向: 车辆前后方向(正方向为车头)
#   Y轴方向: 车辆左右方向(正方向为左侧)
#   Z轴方向: 垂直方向(正方向为上方)
area_min_x: -0.7     # X轴最小值(米)
area_max_x: 0.9      # X轴最大值(米)
area_min_y: -0.60    # Y轴最小值(米)
area_max_y: 0.60     # Y轴最大值(米)
area_min_z: 0.2      # Z轴最小值(米)
area_max_z: 1.00     # Z轴最大值(米)

# ---------- 车体轮廓参数 ----------
# 定义车辆在XY平面上的多边形轮廓(在velodyne坐标系下)
# 用于过滤车辆自身的激光雷达反射点(使用IrregularPolygonFilter的反向滤波)
# 顶点按顺序连接形成多边形，坐标单位为米
car_rect:
  - {x: 0.60, y: -1.00}    # 车体轮廓顶点(右前)
  - {x: 0.60, y: -1.00}    # 重复顶点
  - {x: 0.10, y: -1.00}    # 车体轮廓顶点
  - {x: -0.20, y: -1.00}   # 车体轮廓顶点
  - {x: -0.22, y: -1.00}   # 车体轮廓顶点
  - {x: -1.26, y: -1.00}   # 车体轮廓顶点(右后)
  - {x: -1.26, y: 1.00}    # 车体轮廓顶点(左后)
  - {x: -0.22, y: 1.00}    # 车体轮廓顶点
  - {x: -0.20, y: 1.00}    # 车体轮廓顶点
  - {x: 0.10, y: 1.00}     # 车体轮廓顶点
  - {x: 0.60, y: 1.00}     # 车体轮廓顶点(左前)
  - {x: 0.60, y: 1.00}     # 重复顶点
car_min_z: -1.90            # 车体Z轴最小值(米) - 底盘下方
car_max_z: 0.50             # 车体Z轴最大值(米) - 车顶

# ---------- 防误判参数 ----------
min_region_points: 5                    # 区域内点数低于此值不判定为障碍物
area_history_size: 5                    # 滑动窗口大小(帧数)
area_confirm_threshold: 3               # 窗口内需有N帧检测到才确认
area_clear_threshold: 1                 # 清除阈值，窗口内检测到噪声的帧数<=此值时才清除

# ========== 外围聚类检测参数(Layer 2) ==========
# 当大型障碍物完全占据库位入口，激光点落在库位框外时，
# Layer 1(内部区域检测)无法检测到，此时触发Layer 2补充检测。
enable_proximity_cluster: true          # 是否启用外围聚类检测
cluster_tolerance: 0.2                  # 聚类容差(米)，同一物体的点间距阈值
cluster_min_points: 8                   # 最小聚类点数，过滤散射噪声
cluster_max_points: 1000                # 最大聚类点数，过滤墙壁等大结构
cluster_max_z_range: 5.0                # 聚类z范围上限(米)，过滤地面合并的巨型cluster
cluster_min_centroid_z: -1.0            # 聚类重心最低高度(米)，过滤残余地面
expand_margin_x: 1.0                    # X方向扩展边界(米)，检测库位入口附近区域
expand_margin_y: 0.5                    # Y方向扩展边界(米)
proximity_threshold: 0.5                # 聚类到库位框最大距离(米)，低于此值判定为邻近障碍物

# ========== 调试参数 ==========
# proximity_debug: 外围聚类检测调试日志
#   true  → 输出每个cluster的详细过滤信息(点数、z范围、重心、距离等)
#   false → 仅输出检测结果(默认)
# log_level: ROS日志级别(DEBUG/INFO/WARN/ERROR/FATAL)
proximity_debug: true

# ========== 日志级别 ==========
log_level: "INFO"