# ============================================================
# 障碍物检测节点配置文件
# ============================================================
# 该文件包含以下配置：
#   1. 中距雷达外参标定参数
#   2. 电梯检测区域边界框(在目标点局部坐标系下)
#   3. 库位检测区域边界框(在目标点局部坐标系下)
#   4. 车体轮廓多边形(用于过滤车辆自身的激光反射点)
#   5. 库位外围聚类检测参数(Layer 2)
#   6. 调试参数
# ============================================================

# ---------- 中距雷达标定参数 ----------
# 用于补偿中距雷达的安装偏差(外参标定)
# 通过6DOF变换(平移+旋转)将原始点云变换到正确的位置
# 标定后的点云会发布到 /calibration_points_mid 供调试
points_mid:
  x: 0.0          # X轴平移偏移(米)
  y: 0.0          # Y轴平移偏移(米)
  z: 0.0          # Z轴平移偏移(米)
  roll: 0.0       # 绕X轴旋转偏移(弧度)
  pitch: 0.0      # 绕Y轴旋转偏移(弧度)
  yaw: 0.0        # 绕Z轴旋转偏移(弧度)

# ---------- 电梯检测区域参数 ----------
# 在目标点的局部坐标系下定义的3D边界框
# 当目标点类型为电梯时，使用此参数检测轿厢内是否有异物
# 检测逻辑：将障碍物点变换到目标点局部坐标系，判断是否在此范围内
#   X轴方向: 车辆前后方向(正方向为车头)
#   Y轴方向: 车辆左右方向(正方向为左侧)
#   Z轴方向: 垂直方向(正方向为上方)
elevator_min_x: -1.45    # X轴最小值(米) - 车辆后方
elevator_max_x: 0.95     # X轴最大值(米) - 车辆前方
elevator_min_y: -0.80    # Y轴最小值(米) - 车辆右侧
elevator_max_y: 0.80     # Y轴最大值(米) - 车辆左侧
elevator_min_z: 0.00     # Z轴最小值(米) - 地面
elevator_max_z: 2.00     # Z轴最大值(米) - 电梯轿厢顶部

# ---------- 库位检测区域参数 ----------
# 在目标点的局部坐标系下定义的3D边界框
# 当目标点类型为库位(停车位)时，使用此参数检测停车位是否有障碍物
# 与电梯区域类似，但范围更小(停车位空间比电梯轿厢小)
carports_min_x: -0.7     # X轴最小值(米)
carports_max_x: 0.9      # X轴最大值(米)
carports_min_y: -0.60    # Y轴最小值(米)
carports_max_y: 0.60     # Y轴最大值(米)
carports_min_z: 0.00     # Z轴最小值(米)
carports_max_z: 1.00     # Z轴最大值(米)

# ---------- 车体轮廓参数 ----------
# 定义车辆在XY平面上的多边形轮廓(在velodyne坐标系下)
# 用于过滤车辆自身的激光雷达反射点(使用IrregularPolygonFilter的反向滤波)
# 顶点按顺序连接形成多边形，坐标单位为米
# 注意：当前配置中部分顶点坐标重复，可能存在配置冗余
car_rect:
  - {x: 0.60, y: -1.00}    # 车体轮廓顶点1(右前)
  - {x: 0.60, y: -1.00}    # 重复顶点
  - {x: 0.10, y: -1.00}    # 车体轮廓顶点
  - {x: -0.20, y: -1.00}   # 车体轮廓顶点
  - {x: -0.22, y: -1.00}   # 车体轮廓顶点
  - {x: -1.26, y: -1.00}   # 车体轮廓顶点(右后)
  - {x: -1.26, y: 1.00}    # 车体轮廓顶点(左后)
  - {x: -0.22, y: 1.00}    # 车体轮廓顶点
  - {x: -0.20, y: 1.00}    # 车体轮廓顶点
  - {x: 0.10, y: 1.00}     # 车体轮廓顶点
  - {x: 0.60, y: 1.00}     # 车体轮廓顶点(左前)
  - {x: 0.60, y: 1.00}     # 重复顶点
car_min_z: -1.90            # 车体Z轴最小值(米) - 底盘下方
car_max_z: 0.50             # 车体Z轴最大值(米) - 车顶

# ========== 库位外围聚类检测参数(Layer 2) ==========
# 当大型障碍物完全占据库位入口，激光点落在库位框外时，
# Layer 1(内部区域检测)无法检测到，此时触发Layer 2补充检测。
# 仅对mid360预处理后的点云做聚类(独立于电梯聚类)。
garage_enable_proximity_cluster: true    # 是否启用外围聚类检测
garage_cluster_tolerance: 0.2           # 聚类容差(米)，同一物体的点间距阈值
garage_cluster_min_points: 8            # 最小聚类点数，过滤散射噪声
garage_cluster_max_points: 300          # 最大聚类点数，过滤墙壁等大结构
garage_cluster_max_z_range: 1.0         # 聚类z范围上限(米)，过滤地面合并的巨型cluster
garage_cluster_min_centroid_z: 0.05     # 聚类重心最低高度(米)，过滤残余地面
garage_expand_margin_x: 0.5            # X方向扩展边界(米)，检测库位入口附近区域
garage_expand_margin_y: 0.3            # Y方向扩展边界(米)
garage_proximity_threshold: 0.3         # 聚类到库位框最大距离(米)，低于此值判定为邻近障碍物

# ========== 调试参数 ==========
# garage_proximity_debug: 外围聚类检测调试日志
#   true  → 输出每个cluster的详细过滤信息(点数、z范围、重心、距离等)
#   false → 仅输出检测结果(默认)
# log_level: ROS日志级别(DEBUG/INFO/WARN/ERROR/FATAL)
garage_proximity_debug: false
# log_level: "DEBUG"